<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家务奖惩记录本</title>
<style>
:root {
  --bg: #f0f4f8;
  --card-bg: #ffffff;
  --text: #1a202c;
  --text-light: #64748b;
  --border: #e2e8f0;
  --reward: #22c55e;
  --reward-bg: #f0fdf4;
  --punish: #ef4444;
  --punish-bg: #fef2f2;
  --gold: #f59e0b;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
*:focus { outline: none; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 60px;
}

/* ===== Header ===== */
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 16px 20px 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
}
.header h1 {
  font-size: 20px;
  font-weight: 700;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.header .date {
  font-size: 13px;
  opacity: 0.85;
  margin-top: 2px;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.header-actions { display: flex; gap: 8px; }
.header-actions button {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
}
.header-actions button:hover { background: rgba(255,255,255,0.35); }

/* ===== Tabs ===== */
.tabs {
  display: flex;
  background: var(--card-bg);
  box-shadow: var(--shadow);
  position: sticky;
  top: 56px;
  z-index: 99;
}
.tab {
  flex: 1;
  text-align: center;
  padding: 12px 4px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-light);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  user-select: none;
}
.tab.active {
  color: #667eea;
  border-bottom-color: #667eea;
}
.tab:active { background: #f7f7f7; }

/* ===== Pages ===== */
.page { display: none; padding: 16px; max-width: 680px; margin: 0 auto; }
.page.active { display: block; }

/* ===== Child Selector ===== */
.child-selector {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}
.child-card {
  flex: 1;
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  border: 3px solid transparent;
  box-shadow: var(--shadow);
  transition: all 0.2s;
}
.child-card.active { border-color: #667eea; }
.child-card:active { transform: scale(0.97); }
.child-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  margin: 0 auto 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
}
.child-name {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}
.child-balance {
  font-size: 18px;
  font-weight: 800;
}
.child-balance.positive { color: var(--reward); }
.child-balance.negative { color: var(--punish); }
.child-balance.zero { color: var(--text-light); }

/* ===== Reward/Punish Toggle ===== */
.type-toggle {
  display: flex;
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 4px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.type-toggle button {
  flex: 1;
  padding: 11px;
  border: none;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-light);
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s;
}
.type-toggle button.active.reward {
  background: var(--reward);
  color: white;
  box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
}
.type-toggle button.active.punish {
  background: var(--punish);
  color: white;
  box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
}

/* ===== Category Group ===== */
.category-group { margin-bottom: 12px; }
.category-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-light);
  padding: 8px 4px 6px;
}
.item-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
@media (min-width: 480px) {
  .item-grid { grid-template-columns: repeat(3, 1fr); }
}
.item-btn {
  background: var(--card-bg);
  border: none;
  border-radius: 10px;
  padding: 10px 6px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.15s;
  font-family: inherit;
}
.item-btn:active { transform: scale(0.95); }
.item-btn.selected { border: 2px solid #667eea; }
.item-btn .item-name {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 4px;
}
.item-btn .item-amount {
  font-size: 13px;
  font-weight: 800;
}
.item-btn.reward .item-amount { color: var(--reward); }
.item-btn.punish .item-amount { color: var(--punish); }

/* ===== Amount Input Modal ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  justify-content: center;
  align-items: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: white;
  border-radius: 16px;
  width: 90%;
  max-width: 380px;
  padding: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.modal h3 {
  font-size: 16px;
  margin-bottom: 4px;
}
.modal .modal-note {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 14px;
}
.modal label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
  display: block;
  margin-bottom: 4px;
}
.modal input[type="number"],
.modal input[type="text"],
.modal textarea {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 16px;
  font-family: inherit;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.modal input:focus,
.modal textarea:focus { border-color: #667eea; }
.modal textarea { resize: vertical; min-height: 50px; }
.amount-hint {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 12px;
  margin-top: -8px;
}
.modal-actions {
  display: flex;
  gap: 10px;
}
.modal-actions button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.btn-cancel { background: #f1f5f9; color: var(--text-light); }
.btn-confirm { background: #667eea; color: white; }

/* ===== Today Records ===== */
.section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 20px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.today-records {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.record-item {
  display: flex;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  gap: 10px;
}
.record-item:last-child { border-bottom: none; }
.record-item .rec-child {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.record-item .rec-info {
  flex: 1;
  min-width: 0;
}
.record-item .rec-name {
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.record-item .rec-detail {
  font-size: 12px;
  color: var(--text-light);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.record-item .rec-amount {
  font-size: 16px;
  font-weight: 800;
  flex-shrink: 0;
}
.record-item .rec-amount.reward { color: var(--reward); }
.record-item .rec-amount.punish { color: var(--punish); }
.record-item .rec-delete {
  width: 28px; height: 28px;
  border: none;
  background: transparent;
  color: #cbd5e1;
  cursor: pointer;
  font-size: 18px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.record-item .rec-delete:hover { background: var(--punish-bg); color: var(--punish); }

.empty-state {
  text-align: center;
  padding: 32px 20px;
  color: var(--text-light);
}
.empty-state .empty-icon { font-size: 36px; margin-bottom: 8px; }

/* ===== History Page ===== */
.history-toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  align-items: center;
}
.history-toolbar input[type="date"] {
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  background: white;
}
.history-toolbar select {
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  background: white;
  cursor: pointer;
}
.history-nav {
  display: flex;
  gap: 6px;
  align-items: center;
}
.history-nav button {
  border: 2px solid var(--border);
  background: white;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 14px;
  cursor: pointer;
}

.history-day-summary {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  display: flex;
  gap: 16px;
}
.history-day-summary .hds-item {
  text-align: center;
}
.history-day-summary .hds-label {
  font-size: 11px;
  color: var(--text-light);
}
.history-day-summary .hds-value {
  font-size: 17px;
  font-weight: 800;
}

/* ===== Weekly Page ===== */
.week-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 12px 16px;
  box-shadow: var(--shadow);
}
.week-toolbar button {
  border: 2px solid var(--border);
  background: white;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
}
.week-toolbar .week-label {
  text-align: center;
}
.week-toolbar .week-range {
  font-size: 14px;
  font-weight: 700;
}
.week-toolbar .week-num {
  font-size: 12px;
  color: var(--text-light);
}

/* Ranking */
.ranking {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}
.rank-card {
  flex: 1;
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px 12px;
  text-align: center;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.rank-card.first { border: 3px solid var(--gold); }
.rank-badge {
  font-size: 28px;
  margin-bottom: 4px;
}
.rank-card.first .rank-badge::after { content: "\1F947"; }
.rank-card:not(.first) .rank-badge::after { content: "\1F948"; }
.rank-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.rank-net { font-size: 24px; font-weight: 800; }
.rank-net.positive { color: var(--reward); }
.rank-net.negative { color: var(--punish); }
.rank-net.zero { color: var(--text-light); }
.rank-detail {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
}

/* Weekly summary table */
.weekly-table {
  width: 100%;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  border-collapse: collapse;
  margin-bottom: 16px;
}
.weekly-table th, .weekly-table td {
  padding: 10px 12px;
  text-align: center;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}
.weekly-table th {
  background: #f8fafc;
  font-weight: 700;
  color: var(--text-light);
  font-size: 12px;
}
.weekly-table td { font-weight: 600; }
.weekly-table .td-reward { color: var(--reward); }
.weekly-table .td-punish { color: var(--punish); }
.weekly-table .td-net.positive { color: var(--reward); }
.weekly-table .td-net.negative { color: var(--punish); }
.weekly-table tr:last-child td { border-bottom: none; }
.weekly-table tfoot td { font-weight: 800; font-size: 14px; background: #f8fafc; }

/* Weekly category breakdown */
.category-breakdown {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  margin-bottom: 12px;
}
.category-breakdown .cb-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.category-breakdown .cb-row {
  display: flex;
  justify-content: space-between;
  padding: 5px 0;
  border-bottom: 1px solid #f1f5f9;
  font-size: 13px;
}
.category-breakdown .cb-row:last-child { border-bottom: none; }
.cb-row .cb-label { color: var(--text-light); }
.cb-row .cb-val { font-weight: 700; }

/* Daily chart bar */
.daily-bars {
  display: flex;
  gap: 4px;
  height: 80px;
  align-items: flex-end;
  margin-top: 10px;
}
.daily-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.daily-bar {
  width: 100%;
  border-radius: 4px 4px 0 0;
  min-height: 3px;
  transition: height 0.3s;
}
.daily-bar.reward { background: var(--reward); }
.daily-bar.punish { background: var(--punish); }
.daily-bar-label { font-size: 10px; color: var(--text-light); }

/* Settle button */
.settle-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  box-shadow: 0 4px 14px rgba(102, 126, 234, 0.3);
  transition: transform 0.15s;
  margin-top: 6px;
}
.settle-btn:active { transform: scale(0.98); }

/* Settings Modal */
.settings-content { max-height: 60vh; overflow-y: auto; }
.child-edit-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  align-items: center;
}
.child-edit-row input {
  flex: 1;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
}
.child-edit-row select {
  padding: 10px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 30%;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 10px 22px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  z-index: 300;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Settled week badge */
.settled-badge {
  display: inline-block;
  background: var(--gold);
  color: white;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 700;
  margin-left: 6px;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-bar">
    <div>
      <h1>家务奖惩记录本</h1>
      <div class="date" id="todayDate"></div>
    </div>
    <div class="header-actions">
      <button onclick="openSettings()">设置</button>
      <button onclick="exportData()">备份</button>
      <button onclick="document.getElementById('importFile').click()">恢复</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-page="today" onclick="switchPage('today')">今日记录</div>
  <div class="tab" data-page="history" onclick="switchPage('history')">历史记录</div>
  <div class="tab" data-page="weekly" onclick="switchPage('weekly')">周报结算</div>
</div>

<!-- ===== Today Page ===== -->
<div class="page active" id="page-today">
  <div class="child-selector" id="childSelector"></div>

  <div class="type-toggle">
    <button class="active reward" id="btnReward" onclick="switchType('reward')">奖励 +</button>
    <button class="punish" id="btnPunish" onclick="switchType('punish')">惩罚 -</button>
  </div>

  <div id="itemList"></div>

  <div class="section-title">今日记录</div>
  <div id="todayRecords"></div>
</div>

<!-- ===== History Page ===== -->
<div class="page" id="page-history">
  <div class="history-toolbar">
    <div class="history-nav">
      <button onclick="historyPrevDay()">&lt;</button>
      <input type="date" id="historyDate">
      <button onclick="historyNextDay()">&gt;</button>
    </div>
    <select id="historyFilter" onchange="renderHistory()">
      <option value="all">全部</option>
    </select>
  </div>
  <div class="history-day-summary" id="historySummary"></div>
  <div id="historyRecords"></div>
</div>

<!-- ===== Weekly Page ===== -->
<div class="page" id="page-weekly">
  <div class="week-toolbar">
    <button onclick="weekPrev()">&lt; 上周</button>
    <div class="week-label">
      <div class="week-range" id="weekRange"></div>
      <div class="week-num" id="weekNum"></div>
    </div>
    <button onclick="weekNext()">下周 &gt;</button>
  </div>

  <div class="section-title">本周排名</div>
  <div class="ranking" id="ranking"></div>

  <div class="section-title">每日收支</div>
  <div id="dailyChart" style="background:white;border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:16px;"></div>

  <div class="section-title">分类汇总</div>
  <div id="categoryBreakdown"></div>

  <div class="section-title">明细列表</div>
  <div id="weeklyRecords"></div>

  <button class="settle-btn" id="settleBtn" onclick="toggleSettle()">标记本周已结算</button>
</div>

<!-- ===== Amount Input Modal ===== -->
<div class="modal-overlay" id="amountModal">
  <div class="modal">
    <h3 id="modalItemName"></h3>
    <div class="modal-note" id="modalItemNote"></div>
    <label>金额（元）</label>
    <input type="number" id="modalAmount" step="0.5" min="0">
    <div class="amount-hint" id="amountHint"></div>
    <label>原因 / 备注（选填）</label>
    <textarea id="modalReason" placeholder="如：今天扫地扫得很干净"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-confirm" onclick="confirmAdd()">确认记录</button>
    </div>
  </div>
</div>

<!-- ===== Settings Modal ===== -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>设置</h3>
    <div class="modal-note">修改孩子姓名和头像</div>
    <div class="settings-content" id="settingsContent"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeSettings()">取消</button>
      <button class="btn-confirm" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================== Data =====================
const STORAGE_KEY = 'chore_reward_records_v1';
const SETTINGS_KEY = 'chore_reward_settings_v1';

const defaultSettings = {
  children: [
    { name: '大宝', avatar: '👦', color: '#3b82f6' },
    { name: '小宝', avatar: '👧', color: '#ec4899' }
  ]
};

// Reward items from the document
const rewardItems = [
  { category: '🧹 家务劳动', name: '扫地 / 拖地', min: 1, max: 2, note: '视完成质量而定' },
  { category: '🧹 家务劳动', name: '洗碗 / 擦桌子', min: 1, max: 3, note: '包含收拾餐桌' },
  { category: '🧹 家务劳动', name: '洗衣服 / 收衣服 / 晾衣', min: 1, max: 2, note: '分类整理好可拿上限' },

let settings = loadSettings();

// ===================== Utils =====================
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function loadSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || JSON.parse(JSON.stringify(defaultSettings)); }
  catch(e) { return JSON.parse(JSON.stringify(defaultSettings)); }
}

function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
}

function saveRecords() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function getChildBalance(idx) {
  let bal = 0;
  records.filter(r => r.child === idx).forEach(r => bal += r.amount);
  return bal;
}

function getWeekRange(offset) {
  const now = new Date();
  const day = now.getDay() || 7; // Mon=1..Sun=7
  const monday = new Date(now);
  monday.setDate(now.getDate() - day + 1 + offset * 7);
  monday.setHours(0,0,0,0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return { monday, sunday };
}

function fmtDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function fmtDateCN(d) {
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}

function weekKey(date) {
  const d = new Date(date);
  const day = d.getDay() || 7;
  const monday = new Date(d);
  monday.setDate(d.getDate() - day + 1);
  return fmtDate(monday);
}

// ===================== Render: Header Date =====================
function renderDate() {
  const d = new Date();
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('todayDate').textContent =
    d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+weekdays[d.getDay()];
}

// ===================== Render: Child Selector =====================
function renderChildSelector() {
  const el = document.getElementById('childSelector');
  el.innerHTML = '';
  settings.children.forEach((c, i) => {
    const bal = getChildBalance(i);
    const card = document.createElement('div');
    card.className = 'child-card' + (i === currentChild ? ' active' : '');
    card.onclick = () => { currentChild = i; renderChildSelector(); renderItemList(); renderTodayRecords(); };
    const cls = bal > 0 ? 'positive' : bal < 0 ? 'negative' : 'zero';
    card.innerHTML = `
      <div class="child-avatar" style="background:${c.color}22">${c.avatar}</div>
      <div class="child-name">${c.name}</div>
      <div class="child-balance ${cls}">${bal >= 0 ? '+' : ''}${bal.toFixed(1)}元</div>
    `;
    el.appendChild(card);
  });
}

// ===================== Render: Item List =====================
function switchType(type) {
  currentType = type;
  document.getElementById('btnReward').classList.toggle('active', type === 'reward');
  document.getElementById('btnPunish').classList.toggle('active', type === 'punish');
  renderItemList();
}

function renderItemList() {
  const items = currentType === 'reward' ? rewardItems : punishItems;
  const el = document.getElementById('itemList');
  const groups = {};
  items.forEach(item => {
    if (!groups[item.category]) groups[item.category] = [];
    groups[item.category].push(item);
  });

  el.innerHTML = '';
  Object.keys(groups).forEach(cat => {
    const group = document.createElement('div');
    group.className = 'category-group';
    group.innerHTML = `<div class="category-title">${cat}</div>`;
    const grid = document.createElement('div');
    grid.className = 'item-grid';
    groups[cat].forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'item-btn ' + currentType;
      const amountText = item.perHour
        ? (item.min === item.max ? item.min + '元/小时' : item.min + '-' + item.max + '元/小时')
        : (item.min === item.max ? item.min + '元' : item.min + '-' + item.max + '元');
      const sign = currentType === 'reward' ? '+' : '-';
      btn.innerHTML = `
        <div class="item-name">${item.name}</div>
        <div class="item-amount">${sign}${amountText}</div>
      `;
      btn.onclick = () => openAmountModal(item);
      grid.appendChild(btn);
    });
    group.appendChild(grid);
    el.appendChild(group);
  });
}

// ===================== Amount Modal =====================
function openAmountModal(item) {
  selectedItem = item;
  document.getElementById('modalItemName').textContent = item.name;
  document.getElementById('modalItemNote').textContent = item.note;
  const amountInput = document.getElementById('modalAmount');
  amountInput.value = item.min;
  const hint = document.getElementById('amountHint');
  if (item.perHour) {
    hint.textContent = `按小时计费，范围 ${item.min}-${item.max} 元/小时`;
    amountInput.step = '0.5';
  } else if (item.min === item.max) {
    hint.textContent = `固定金额 ${item.min} 元`;
    amountInput.step = '0.5';
  } else {
    hint.textContent = `范围 ${item.min}-${item.max} 元`;
    amountInput.step = '0.5';
  }
  document.getElementById('modalReason').value = '';
  document.getElementById('amountModal').classList.add('show');
  setTimeout(() => amountInput.focus(), 100);
}

function closeModal() {
  document.getElementById('amountModal').classList.remove('show');
  selectedItem = null;
}

function confirmAdd() {
  if (!selectedItem) return;
  const amount = parseFloat(document.getElementById('modalAmount').value);
  if (isNaN(amount) || amount <= 0) {
    showToast('请输入有效金额');
    return;
  }
  const reason = document.getElementById('modalReason').value.trim();
  const signed = currentType === 'reward' ? amount : -amount;

  const record = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,6),
    date: todayStr(),
    timestamp: Date.now(),
    child: currentChild,
    type: currentType,
    category: selectedItem.category,
    itemName: selectedItem.name,
    amount: signed,
    rawAmount: amount,
    perHour: !!selectedItem.perHour,
    reason: reason
  };
  records.push(record);
  saveRecords();
  closeModal();
  renderChildSelector();
  renderTodayRecords();
  showToast('记录已添加');
}

// ===================== Today Records =====================
function renderTodayRecords() {
  const el = document.getElementById('todayRecords');
  const todayRecs = records.filter(r => r.date === todayStr()).sort((a,b) => b.timestamp - a.timestamp);
  if (todayRecs.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div><div>今天还没有记录</div><div style="font-size:12px;margin-top:4px">从上方选择奖励或惩罚项目开始记录</div></div>`;
    return;
  }
  el.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'today-records';
  todayRecs.forEach(r => {
    const child = settings.children[r.child];
    const row = document.createElement('div');
    row.className = 'record-item';
    const sign = r.amount > 0 ? '+' : '';
    row.innerHTML = `
      <div class="rec-child" style="background:${child.color}22">${child.avatar}</div>
      <div class="rec-info">
        <div class="rec-name">${child.name} · ${r.itemName}</div>
        <div class="rec-detail">${r.reason || r.note || r.category}${r.perHour ? ' · 按小时' : ''}</div>
      </div>
      <div class="rec-amount ${r.type}">${sign}${Math.abs(r.amount).toFixed(1)}元</div>
      <button class="rec-delete" onclick="deleteRecord('${r.id}')">×</button>
    `;
    list.appendChild(row);
  });
  el.appendChild(list);
}

function deleteRecord(id) {
  records = records.filter(r => r.id !== id);
  saveRecords();
  renderChildSelector();
  renderTodayRecords();
  showToast('已删除');
}

    sel.innerHTML += `<option value="${i}">${c.name}</option>`;

function renderHistory() {
  renderHistoryFilter();
  const date = document.getElementById('historyDate').value;
  if (!date) return;
  const filterVal = document.getElementById('historyFilter').value;
  let dayRecs = records.filter(r => r.date === date);
  if (filterVal !== 'all') {
    dayRecs = dayRecs.filter(r => r.child === parseInt(filterVal));
  }
  dayRecs.sort((a,b) => a.timestamp - b.timestamp);

  // Summary
  const summaryEl = document.getElementById('historySummary');
  let totalReward = 0, totalPunish = 0;
  dayRecs.forEach(r => { if (r.amount > 0) totalReward += r.amount; else totalPunish += Math.abs(r.amount); });
  const net = totalReward - totalPunish;
  const d = new Date(date);
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  summaryEl.innerHTML = `
    <div class="hds-item"><div class="hds-label">${(d.getMonth()+1)}月${d.getDate()}日 ${weekdays[d.getDay()]}</div><div class="hds-value">${dayRecs.length}条</div></div>
    <div class="hds-item"><div class="hds-label">奖励</div><div class="hds-value" style="color:var(--reward)">+${totalReward.toFixed(1)}</div></div>
    <div class="hds-item"><div class="hds-label">惩罚</div><div class="hds-value" style="color:var(--punish)">-${totalPunish.toFixed(1)}</div></div>
    <div class="hds-item"><div class="hds-label">合计</div><div class="hds-value" style="color:${net>=0?'var(--reward)':'var(--punish)'}">${net>=0?'+':''}${net.toFixed(1)}</div></div>
  `;

  // Records
  const el = document.getElementById('historyRecords');
  if (dayRecs.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div>当天没有记录</div></div>`;
    return;
  }
  // Group by child
  const byChild = {};
  dayRecs.forEach(r => {
    if (!byChild[r.child]) byChild[r.child] = [];
    byChild[r.child].push(r);
  });

  el.innerHTML = '';
  Object.keys(byChild).forEach(ci => {
    const child = settings.children[ci];
    const crecs = byChild[ci];
    let cNet = crecs.reduce((s,r) => s + r.amount, 0);
    const section = document.createElement('div');
    section.className = 'section-title';
    section.innerHTML = `${child.avatar} ${child.name} <span style="font-size:14px;color:${cNet>=0?'var(--reward)':'var(--punish)'}">${cNet>=0?'+':''}${cNet.toFixed(1)}元</span>`;
    el.appendChild(section);

    const list = document.createElement('div');
    list.className = 'today-records';
    crecs.forEach(r => {
      const row = document.createElement('div');
      row.className = 'record-item';
      const sign = r.amount > 0 ? '+' : '';
      row.innerHTML = `
        <div class="rec-child" style="background:${child.color}22">${child.avatar}</div>
        <div class="rec-info">
          <div class="rec-name">${r.itemName}</div>
          <div class="rec-detail">${r.reason || r.category}${r.perHour?' · 按小时':''}</div>
        </div>
        <div class="rec-amount ${r.type}">${sign}${Math.abs(r.amount).toFixed(1)}元</div>
        <button class="rec-delete" onclick="deleteRecord('${r.id}');renderHistory();">×</button>
      `;
      list.appendChild(row);
    });
    el.appendChild(list);
  });
}

// ===================== Weekly Page =====================
function renderWeekly() {
  const { monday, sunday } = getWeekRange(weekOffset);
  document.getElementById('weekRange').textContent = fmtDateCN(monday) + ' - ' + fmtDateCN(sunday);
  const weekNum = Math.ceil((monday.getDate()) / 7);
  document.getElementById('weekNum').textContent = monday.getFullYear() + '年' + (monday.getMonth()+1) + '月 第' + weekNum + '周';

  const mStr = fmtDate(monday);
  const sStr = fmtDate(sunday);
  const weekRecs = records.filter(r => r.date >= mStr && r.date <= sStr);

  // Ranking
  const rankingEl = document.getElementById('ranking');
  rankingEl.innerHTML = '';
  const childStats = settings.children.map((c, i) => {
    const crecs = weekRecs.filter(r => r.child === i);
    const reward = crecs.filter(r => r.amount > 0).reduce((s,r) => s + r.amount, 0);
    const punish = crecs.filter(r => r.amount < 0).reduce((s,r) => s + Math.abs(r.amount), 0);
    return { idx: i, name: c.name, avatar: c.avatar, color: c.color, reward, punish, net: reward - punish, count: crecs.length };
  });
  childStats.sort((a,b) => b.net - a.net);

  childStats.forEach((s, rank) => {
    const card = document.createElement('div');
    card.className = 'rank-card' + (rank === 0 ? ' first' : '');
    const cls = s.net > 0 ? 'positive' : s.net < 0 ? 'negative' : 'zero';
    card.innerHTML = `
      <div class="rank-badge"></div>
      <div class="rank-name">${s.avatar} ${s.name}</div>
      <div class="rank-net ${cls}">${s.net>=0?'+':''}${s.net.toFixed(1)}元</div>
      <div class="rank-detail">奖励+${s.reward.toFixed(1)} | 惩罚-${s.punish.toFixed(1)} | ${s.count}条</div>
    `;
    rankingEl.appendChild(card);
  });

  // Daily chart
  renderDailyChart(monday, weekRecs);

  // Category breakdown
  renderCategoryBreakdown(weekRecs);

  // Weekly records list
  renderWeeklyRecords(weekRecs);

  // Settle button state
  const wk = weekKey(fmtDate(monday));
  const settled = isWeekSettled(wk);
  const btn = document.getElementById('settleBtn');
  btn.textContent = settled ? '✓ 本周已结算（点击取消）' : '标记本周已结算';
}

function renderDailyChart(monday, weekRecs) {
  const el = document.getElementById('dailyChart');
  const days = ['一','二','三','四','五','六','日'];
  let maxVal = 1;
  const dayData = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const ds = fmtDate(d);
    const dr = weekRecs.filter(r => r.date === ds);
    const reward = dr.filter(r => r.amount > 0).reduce((s,r) => s + r.amount, 0);
    const punish = dr.filter(r => r.amount < 0).reduce((s,r) => s + Math.abs(r.amount), 0);
    dayData.push({ reward, punish });
    if (reward > maxVal) maxVal = reward;
    if (punish > maxVal) maxVal = punish;
  }

  let html = '<div class="daily-bars">';
  for (let i = 0; i < 7; i++) {
    const dd = dayData[i];
    const rh = (dd.reward / maxVal * 60).toFixed(0);
    const ph = (dd.punish / maxVal * 60).toFixed(0);
    html += `<div class="daily-bar-col">
      <div style="display:flex;gap:2px;width:100%;align-items:flex-end;height:60px;justify-content:center">
        <div class="daily-bar reward" style="height:${rh}px;max-width:14px" title="奖励${dd.reward.toFixed(1)}"></div>
        <div class="daily-bar punish" style="height:${ph}px;max-width:14px" title="惩罚${dd.punish.toFixed(1)}"></div>
      </div>
      <div class="daily-bar-label">${days[i]}</div>
    </div>`;
  }
  html += '</div>';
  html += '<div style="display:flex;gap:14px;font-size:11px;color:var(--text-light);justify-content:center;margin-top:8px"><span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--reward);margin-right:3px"></span>奖励</span><span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--punish);margin-right:3px"></span>惩罚</span></div>';
  el.innerHTML = html;
}

function renderCategoryBreakdown(weekRecs) {
  const el = document.getElementById('categoryBreakdown');
  el.innerHTML = '';

  settings.children.forEach((c, ci) => {
    const crecs = weekRecs.filter(r => r.child === ci);
    if (crecs.length === 0) return;
    const catMap = {};
    crecs.forEach(r => {
      if (!catMap[r.category]) catMap[r.category] = { reward: 0, punish: 0 };
      if (r.amount > 0) catMap[r.category].reward += r.amount;
      else catMap[r.category].punish += Math.abs(r.amount);
    });

    const card = document.createElement('div');
    card.className = 'category-breakdown';
    let html = `<div class="cb-title">${c.avatar} ${c.name}</div>`;
    Object.keys(catMap).forEach(cat => {
      const v = catMap[cat];
      const net = v.reward - v.punish;
      html += `<div class="cb-row">
        <span class="cb-label">${cat}</span>
        <span class="cb-val" style="color:${net>=0?'var(--reward)':'var(--punish)'}">${net>=0?'+':''}${net.toFixed(1)}元</span>
      </div>`;
    });
    card.innerHTML = html;
    el.appendChild(card);
  });

  if (el.innerHTML === '') {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div>本周暂无记录</div></div>`;
  }
}

function renderWeeklyRecords(weekRecs) {
  const el = document.getElementById('weeklyRecords');
  if (weekRecs.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><div>本周暂无记录</div></div>`;
    return;
  }
  weekRecs.sort((a,b) => a.date === b.date ? a.timestamp - b.timestamp : a.date.localeCompare(b.date));
  el.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'today-records';
  weekRecs.forEach(r => {
    const child = settings.children[r.child];
    const d = new Date(r.date);
    const row = document.createElement('div');
    row.className = 'record-item';
    const sign = r.amount > 0 ? '+' : '';
    row.innerHTML = `
      <div class="rec-child" style="background:${child.color}22">${child.avatar}</div>
      <div class="rec-info">
        <div class="rec-name">${child.name} · ${r.itemName}</div>
        <div class="rec-detail">${d.getMonth()+1}月${d.getDate()}日 · ${r.reason || r.category}${r.perHour?' · 按小时':''}</div>
      </div>
      <div class="rec-amount ${r.type}">${sign}${Math.abs(r.amount).toFixed(1)}元</div>
      <button class="rec-delete" onclick="deleteRecord('${r.id}');renderWeekly();">×</button>
    `;
    list.appendChild(row);
  });
  el.appendChild(list);
}

// Settled weeks stored in a separate key
const SETTLED_KEY = 'chore_reward_settled_weeks_v1';
function getSettledWeeks() {
  try { return JSON.parse(localStorage.getItem(SETTLED_KEY)) || []; } catch(e) { return []; }
}
function isWeekSettled(wk) {
  return getSettledWeeks().includes(wk);
}
function toggleSettle() {
  const { monday } = getWeekRange(weekOffset);
  const wk = weekKey(fmtDate(monday));
  let settled = getSettledWeeks();
  if (settled.includes(wk)) {
    settled = settled.filter(w => w !== wk);
    showToast('已取消结算标记');
  } else {
    settled.push(wk);
    showToast('已标记本周结算');
  }
  localStorage.setItem(SETTLED_KEY, JSON.stringify(settled));
  renderWeekly();
}

function weekPrev() { weekOffset--; renderWeekly(); }
function weekNext() { weekOffset++; renderWeekly(); }

// ===================== Page Switch =====================
function switchPage(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.page === name));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'history') renderHistory();
  if (name === 'weekly') renderWeekly();
}

// ===================== Settings =====================
const AVATAR_OPTIONS = ['👦','👧','🧒','👶','🐱','🐶','🐰','🌟','🦁','🐯','🐼','🦊'];
function openSettings() {
  settingsDraft = JSON.parse(JSON.stringify(settings));
  const el = document.getElementById('settingsContent');
  el.innerHTML = '';
  settingsDraft.children.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'child-edit-row';
    let avatarOpts = AVATAR_OPTIONS.map(a =>
      `<option value="${a}" ${a===c.avatar?'selected':''}>${a}</option>`
    ).join('');
    row.innerHTML = `
      <select data-field="avatar" data-idx="${i}">${avatarOpts}</select>
      <input type="text" data-field="name" data-idx="${i}" value="${c.name}" placeholder="孩子姓名">
    `;
    el.appendChild(row);
  });
  document.getElementById('settingsModal').classList.add('show');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('show');
  settingsDraft = null;
}

function saveSettings() {
  const inputs = document.querySelectorAll('#settingsContent input, #settingsContent select');
  inputs.forEach(inp => {
    const idx = parseInt(inp.dataset.idx);
    const field = inp.dataset.field;
    settingsDraft.children[idx][field] = inp.value;
  });
  settings = settingsDraft;
  saveSettings();
  closeSettings();
  currentChild = Math.min(currentChild, settings.children.length - 1);
  renderChildSelector();
  renderItemList();
  renderTodayRecords();
  showToast('设置已保存');
}

// ===================== Export / Import =====================
function exportData() {
  const data = {
    records: records,
    settings: settings,
    settledWeeks: getSettledWeeks(),
    exportDate: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '家务奖惩记录_备份_' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('备份文件已下载');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.records) {
        records = data.records;
        saveRecords();
      }
      if (data.settings) {
        settings = data.settings;
        saveSettings();
      }
      if (data.settledWeeks) {
        localStorage.setItem(SETTLED_KEY, JSON.stringify(data.settledWeeks));
      }
      renderChildSelector();
      renderItemList();
      renderTodayRecords();
      showToast('数据恢复成功');
    } catch(err) {
      showToast('文件格式错误');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===================== Init =====================
document.getElementById('historyDate').value = todayStr();
renderDate();
renderChildSelector();
renderItemList();
renderTodayRecords();

// Close modal on overlay click
document.getElementById('amountModal').addEventListener('click', (e) => {
  if (e.target.id === 'amountModal') closeModal();
});
document.getElementById('settingsModal').addEventListener('click', (e) => {
  if (e.target.id === 'settingsModal') closeSettings();
});

// Enter key in amount input confirms
document.getElementById('modalAmount').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') confirmAdd();
});
